<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Edit your LinkUp profile." />
  <meta name="theme-color" content="#0a66c2" />
  <title>Edit profile · LinkUp</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
</head>
<body>
  <div id="navbarMount"></div>

  <main class="container page" style="max-width:660px">
    <h1 style="font-size:1.6rem;margin-bottom:6px">Edit profile</h1>
    <p class="text-muted" style="font-size:.92rem;margin-bottom:22px">
      Update your details, avatar and password.
    </p>

    <div id="editLoading" class="card"><div class="card__body"><div class="loading-block"><div class="spinner"></div><span>Loading your profile…</span></div></div></div>

    <div class="card hidden" id="editShell">
      <div class="card__body">
        <form id="editProfileForm" novalidate>
          <div class="row" style="gap:20px;margin-bottom:26px">
            <div id="avatarPreview"></div>
            <div>
              <div style="font-weight:800;margin-bottom:8px">Profile picture</div>
              <div class="row" style="gap:8px;flex-wrap:wrap">
                <button class="btn btn--soft btn--sm" id="pickAvatar" type="button">Choose image</button>
                <button class="btn btn--danger-ghost btn--sm hidden" id="removeAvatar" type="button">Remove</button>
              </div>
              <input class="hidden" id="profilePicture" name="profilePicture" type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
              <span class="field__error" data-error-for="profilePicture"></span>
              <span class="field__hint">JPG, PNG, GIF or WEBP · up to 5 MB</span>
            </div>
          </div>

          <div class="divider"></div>

          <div class="field">
            <label class="field__label" for="fullName">Full name</label>
            <input class="input" id="fullName" name="fullName" type="text" autocomplete="name" required />
            <span class="field__error" data-error-for="fullName"></span>
          </div>

          <div class="field">
            <label class="field__label" for="username">Username</label>
            <input class="input" id="username" name="username" type="text" autocomplete="username" required />
            <span class="field__error" data-error-for="username"></span>
          </div>

          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required />
            <span class="field__error" data-error-for="email"></span>
          </div>

          <div class="field">
            <label class="field__label" for="bio">Bio</label>
            <textarea class="textarea" id="bio" name="bio" maxlength="160" placeholder="Tell people a little about yourself…"></textarea>
            <span class="field__counter" id="bioCounter"></span>
            <span class="field__error" data-error-for="bio"></span>
          </div>

          <div class="divider"></div>

          <div class="field">
            <label class="field__label" for="password">New password <span class="text-dim" style="font-weight:500">(leave blank to keep the current one)</span></label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
              <button class="input-group__action" id="togglePassword" type="button" aria-label="Show password"></button>
            </div>
            <span class="field__error" data-error-for="password"></span>
          </div>

          <div class="row" style="gap:10px;justify-content:flex-end;margin-top:24px">
            <button class="btn btn--ghost" id="cancelEdit" type="button">Cancel</button>
            <button class="btn btn--primary" type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/editProfile.js"></script>
</body>
</html>
