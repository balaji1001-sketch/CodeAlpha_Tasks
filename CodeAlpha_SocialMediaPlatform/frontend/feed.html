<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your LinkUp feed." />
  <meta name="theme-color" content="#0a66c2" />
  <title>Feed · LinkUp</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
</head>
<body>
  <div id="navbarMount"></div>

  <main class="container page">
    <div class="feed-layout">
      <section class="feed-column">
        <div class="card" id="composer"></div>

        <div class="row-between">
          <div class="row" style="gap:8px">
            <button class="btn btn--primary btn--sm" type="button" data-feed-filter="all">Everyone</button>
            <button class="btn btn--ghost btn--sm" type="button" data-feed-filter="following">Following</button>
          </div>
          <button class="btn btn--icon" id="refreshFeed" type="button" title="Refresh feed" aria-label="Refresh feed"></button>
        </div>

        <div id="feedList"></div>
        <div id="feedStatus"></div>
        <div class="scroll-sentinel" id="feedSentinel"></div>
      </section>

      <aside class="sidebar">
        <div class="card" id="sidebarProfile"></div>
        <div class="card" id="sidebarSuggestions"></div>
        <p class="text-dim" style="font-size:.78rem;padding:0 4px">
          LinkUp · Mini Social Media Platform<br />Built with Express, MongoDB &amp; vanilla JS
        </p>
      </aside>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/postCard.js"></script>
  <script src="js/feed.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('refreshFeed');
      if (btn) btn.innerHTML = window.UI.Icons.refresh;
    });
  </script>
</body>
</html>
