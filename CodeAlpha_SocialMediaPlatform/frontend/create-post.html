<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a new LinkUp post." />
  <meta name="theme-color" content="#0a66c2" />
  <title>Create post · LinkUp</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
</head>
<body>
  <div id="navbarMount"></div>

  <main class="container page" style="max-width:660px">
    <h1 style="font-size:1.6rem;margin-bottom:6px">Create a post</h1>
    <p class="text-muted" style="font-size:.92rem;margin-bottom:22px">
      Pick an image, add a caption, and share it with your followers.
    </p>

    <div class="card">
      <div class="card__body">
        <div class="row" style="gap:11px;margin-bottom:20px" id="composerAuthor"></div>

        <form id="createPostForm" novalidate>
          <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose an image to upload">
            <div class="dropzone__icon" id="dropzoneIcon"></div>
            <div class="dropzone__title">Drag a photo here</div>
            <div class="dropzone__hint">or click to browse · you can also paste from the clipboard</div>
            <div class="dropzone__hint mt-1" id="maxSizeHint"></div>
          </div>

          <input class="hidden" id="imageInput" name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
          <span class="field__error" data-error-for="imageInput"></span>

          <div class="hidden" id="previewArea"></div>

          <div class="field mt-3">
            <label class="field__label" for="caption">Caption</label>
            <textarea class="textarea" id="caption" name="caption" maxlength="2200" placeholder="Write a caption… use #hashtags and @mentions"></textarea>
            <span class="field__counter" id="captionCounter"></span>
          </div>

          <div class="row" style="gap:10px;justify-content:flex-end;margin-top:12px">
            <a class="btn btn--ghost" href="feed.html">Cancel</a>
            <button class="btn btn--primary" id="submitPost" type="submit" disabled>Publish post</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/createPost.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const icon = document.getElementById('dropzoneIcon');
      if (icon) icon.innerHTML = window.UI.Icons.image;
    });
  </script>
</body>
</html>
