<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Server error." />
  <meta name="theme-color" content="#0a66c2" />
  <title>Something went wrong · LinkUp</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
</head>
<body>
  <main class="error-page">
    <div>
      <div class="error-code">500</div>
      <h1 class="error-title">Our server tripped over a cable</h1>
      <p class="error-text">
        Something broke on our side. Give it a moment and try again — if it keeps happening,
        check that the backend is running and connected to MongoDB.
      </p>
      <div class="hero__cta">
        <button class="btn btn--primary btn--lg" type="button" onclick="window.location.reload()">Try again</button>
        <a class="btn btn--ghost btn--lg" href="feed.html">Back to feed</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
